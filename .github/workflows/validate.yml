name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Lint
        run: tflint --recursive

      # Unit tests only. They use mock_provider, so CI needs no cloud
      # credentials and creates nothing billable. Integration tests live in
      # tests-integration/ and are run deliberately, not on every PR.
      - name: Unit tests
        run: terraform test

      - name: Validate examples
        run: |
          for d in examples/*/; do
            echo "== $d"
            terraform -chdir="$d" init -backend=false
            terraform -chdir="$d" validate
          done
